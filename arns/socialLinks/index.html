<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Social Links</title>
		<link rel="stylesheet" href="./social-links.css" data-arns-css="https://arweave.net/0d2S8DQd42C1HGHgcNZmfn59CN70jcHApbcU9MpCV8s" />
		<link rel="icon" type="image/x-icon" href="https://arweave.net/HM7dvXkyOi2PZyxeoB4v-tNSPn3itV6fIK4pWoKM4U8" />
		<link rel="icon" type="image/png" sizes="256x256" href="https://arweave.net/62kt5squQk-jAtyVfoNa2cW1mPKCiqDsqf-_OUGVgtY" />
		<link rel="icon" type="image/png" sizes="164x164" href="https://arweave.net/5k6OpuYXy9bvsWG2xB9NzhRc-IjMUyKBHRPuVMnbAcw" />
		<link rel="icon" type="image/png" sizes="128x128" href="https://arweave.net/WTJTY8tR3P7D_L7oqAX5Jf4TO3kBuIO3Bub0NbGKqHU" />
		<link rel="icon" type="image/png" sizes="16x16" href="https://arweave.net/TcIuwcPpQ0PFurZJ-VCLOELoqcYvNUyGQGQyqnwDUMY" />
		<link rel="icon" type="image/png" sizes="48x48" href="https://arweave.net/7REh6rbVcjyFbPPyI7WpYEo2SNqg2ItRHhDyVkFw2Qw" />
	</head>
	<body>
		<main class="social-container">
			<section class="top-section">
				<div class="profile-section">
					<div class="avatar-container">
						<img id="profileImage" class="avatar" src="https://placehold.co/132x132" alt="Profile" />
						<div class="currency-badge" data-currency="blockDAG">
							<img id="currencyIcon" src="https://placehold.co/24x24" alt="Currency" />
						</div>
					</div>
					<div class="profile-info">
						<div class="profile-header">
							<h1 id="profileName" class="profile-name">Loading...</h1>
							<p id="profileTitle" class="profile-title">Loading...</p>
						</div>
						<p id="profileDescription" class="profile-description">Loading...</p>
					</div>
				</div>
				<div class="social-links-section" id="socialLinksSection"></div>
			</section>
			<section class="bottom-section">
				<div class="promo-items" id="promoItems"></div>
			</section>
		</main>
		<script>
			const isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
			const styleLink = document.querySelector("[data-arns-css]");
			if (!isLocalhost && styleLink) {
				const nextCss = styleLink.getAttribute("data-arns-css");
				if (nextCss && nextCss.startsWith("https://")) styleLink.href = nextCss;
			}
			const script = document.createElement("script");
			script.src = isLocalhost ? "./social-links.js" : "https://arweave.net/SGcHx3j6wgZfEKfUTrd2POsBGVUvDLsihHJ0bUbt4_M";
			document.body.appendChild(script);
		</script>
	</body>
</html>
