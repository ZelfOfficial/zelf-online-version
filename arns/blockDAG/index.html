<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>BlockDAG Name Service</title>
		<link rel="stylesheet" href="./blockdag.css" data-arns-css="https://arweave.net/b3VIOSd7gbSHh9KhBr2-CBSiGXQ3xElfZZ-d9YGuk1k" />
		<link rel="icon" type="image/x-icon" href="https://arweave.net/HM7dvXkyOi2PZyxeoB4v-tNSPn3itV6fIK4pWoKM4U8" />
		<link rel="icon" type="image/png" sizes="256x256" href="https://arweave.net/62kt5squQk-jAtyVfoNa2cW1mPKCiqDsqf-_OUGVgtY" />
		<link rel="icon" type="image/png" sizes="164x164" href="https://arweave.net/5k6OpuYXy9bvsWG2xB9NzhRc-IjMUyKBHRPuVMnbAcw" />
		<link rel="icon" type="image/png" sizes="128x128" href="https://arweave.net/WTJTY8tR3P7D_L7oqAX5Jf4TO3kBuIO3Bub0NbGKqHU" />
		<link rel="icon" type="image/png" sizes="16x16" href="https://arweave.net/TcIuwcPpQ0PFurZJ-VCLOELoqcYvNUyGQGQyqnwDUMY" />
		<link rel="icon" type="image/png" sizes="48x48" href="https://arweave.net/7REh6rbVcjyFbPPyI7WpYEo2SNqg2ItRHhDyVkFw2Qw" />
	</head>
	<body>
		<main class="page">
			<div class="blockdag-logo">
				<img src="https://arweave.net/ID0Hum0y57LJ9wNOc65ZtUPaaQnLIc6ZALav5awU2Xs" alt="BlockDAG" />
			</div>
			<p class="eyebrow">BlockDAG Name Service</p>
			<h1 class="bdag-name" id="bdagName">yourname.bdag</h1>

			<div class="layout">
				<section class="qr-section">
					<div class="qr-card">
						<img id="bdagproof" src="https://arweave.net/szXAC_kSbjeLsB7hrZj0dID73GZEkDYPVUlI5ROAW7c" alt="BDAG proof" />
					</div>
					<div class="download-section">
						<p class="download-text">Get your BDAG name now</p>
						<button class="download-button" id="downloadButton" type="button">Download app</button>
					</div>
				</section>

				<section class="details">
					<div class="addresses-grid" id="addressesGrid"></div>
					<div class="referral-section">
						<div class="referral-header">
							<h2 class="referral-title">Get your own BDAG name</h2>
							<p class="referral-subtitle">Use my BDAG name and get 10% off on your first purchase.</p>
						</div>
						<div class="referral-code-container" id="copyReferralCode">
							<span class="referral-code" id="bdag-name-copy">...</span>
							<button class="copy-button-secondary" type="button">Copy</button>
						</div>
					</div>
				</section>
			</div>
		</main>

		<div class="loading-badge" id="loadingBadge" style="display: none">
			<div class="spinner"></div>
			<span class="badge-label">Loading from <span class="badge-source">Arweave</span></span>
		</div>
		<div class="toast-container" id="toastContainer"></div>
		<script>
			const isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
			const styleLink = document.querySelector("[data-arns-css]");
			if (!isLocalhost && styleLink) {
				const nextCss = styleLink.getAttribute("data-arns-css");
				if (nextCss && nextCss.startsWith("https://")) styleLink.href = nextCss;
			}
			const script = document.createElement("script");
			script.src = isLocalhost ? "./blockdag.js" : "https://arweave.net/Bi1vHttkox28kMMQB9LIPm_gTHTikYdU1eIkqqE1Lqw";
			document.body.appendChild(script);
		</script>
	</body>
</html>
