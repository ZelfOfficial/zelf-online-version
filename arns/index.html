<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Zelf ID</title>
		<link rel="stylesheet" href="./main.css" data-arns-css="https://arweave.net/5W0_ISHRW5KAef7CQlbdFuG2OCODclyNBXNDY96oLT0" />
		<link rel="icon" type="image/x-icon" href="https://arweave.net/HM7dvXkyOi2PZyxeoB4v-tNSPn3itV6fIK4pWoKM4U8" />
		<link rel="icon" type="image/png" sizes="256x256" href="https://arweave.net/62kt5squQk-jAtyVfoNa2cW1mPKCiqDsqf-_OUGVgtY" />
		<link rel="icon" type="image/png" sizes="164x164" href="https://arweave.net/5k6OpuYXy9bvsWG2xB9NzhRc-IjMUyKBHRPuVMnbAcw" />
		<link rel="icon" type="image/png" sizes="128x128" href="https://arweave.net/WTJTY8tR3P7D_L7oqAX5Jf4TO3kBuIO3Bub0NbGKqHU" />
		<link rel="icon" type="image/png" sizes="16x16" href="https://arweave.net/TcIuwcPpQ0PFurZJ-VCLOELoqcYvNUyGQGQyqnwDUMY" />
		<link rel="icon" type="image/png" sizes="48x48" href="https://arweave.net/7REh6rbVcjyFbPPyI7WpYEo2SNqg2ItRHhDyVkFw2Qw" />
	</head>
	<body>
		<header class="header">
			<img class="logo" src="https://arweave.net/u2zb15EXJ5aueRIWSDGQ2leifcZzm7DtTq9osSertZM" alt="Zelf" />
			<div class="button" id="downloadButton">Download app</div>
		</header>

		<main class="page">
			<p class="eyebrow">Zelf ID</p>
			<h1 class="name-label" id="zelfName"></h1>
			<p class="lede">One Zelf ID for every chain. The proof lives on Arweave.</p>

			<div class="loading-badge" id="loadingBadge" style="display: none">
				<div class="spinner"></div>
				<span class="badge-label">Loading from <span class="badge-source">Arweave</span></span>
			</div>

			<div class="layout">
				<section class="proof-card">
					<img id="zelfproof" src="https://arweave.net/szXAC_kSbjeLsB7hrZj0dID73GZEkDYPVUlI5ROAW7c" alt="Zelf proof" />
				</section>

				<section class="details">
					<h2 class="section-label">Wallets</h2>
					<div class="addresses-grid" id="addressesGrid"></div>
				</section>
			</div>

			<section class="promo-div">
				<div>
					<h2>Get your own Zelf ID</h2>
					<p>Use my Zelf ID and get 10% off on your first one.</p>
				</div>
				<div class="referral-code-div" id="copyReferralCode">
					<span id="zelf-name-copy"></span>
					<span class="copy-label">Copy</span>
				</div>
			</section>
		</main>

		<div class="toast-container" id="toastContainer"></div>
		<script>
			const isLocalhost = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
			const styleLink = document.querySelector("[data-arns-css]");
			if (!isLocalhost && styleLink) {
				const nextCss = styleLink.getAttribute("data-arns-css");
				if (nextCss && nextCss.startsWith("https://")) styleLink.href = nextCss;
			}
			const script = document.createElement("script");
			script.src = isLocalhost ? "./main_v2.js" : "https://arweave.net/X6DElvJ_UGYRAKZ_gifbZZbAmo0c4rhW6jjEn80T6F8";
			document.body.appendChild(script);
		</script>
	</body>
</html>
